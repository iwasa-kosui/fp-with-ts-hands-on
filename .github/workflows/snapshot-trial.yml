name: Snapshot Trial

on:
  push:
    branches:
      - feat/preload-exercise-deps

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependency snapshot
        run: node apps/docs/scripts/build-deps-snapshot.mjs --out ${{ runner.temp }}/snapshot

      - name: List output files
        run: ls -lR ${{ runner.temp }}/snapshot
